{% extends "all_dashboard/dashboard.html" %}

{% block table_tasks %}
<!-- TASK TABLE SECTION -->
<div class="mx-auto mt-6 w-full max-w-6xl overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm">
    <table class="min-w-full divide-y divide-gray-200 text-left text-sm">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-4 py-3 font-semibold text-gray-700">Task Title</th>
                <th class="px-4 py-3 font-semibold text-gray-700">Priority</th>
                <th class="px-4 py-3 font-semibold text-gray-700">Team</th>
                <th class="px-4 py-3 font-semibold text-gray-700">Created At</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
            <tr>
                <td class="px-4 py-3">
                    <div class="font-medium text-gray-800">Test Low Task</div>
                    <div class="text-xs text-gray-500">Low priority task</div>
                </td>
                <td class="px-4 py-3">
                    <span class="rounded-full bg-gray-100 px-2.5 py-1 text-xs font-medium text-gray-700">Low</span>
                </td>
                <td class="px-4 py-3">
                    <span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-blue-500 text-xs font-semibold text-white">A</span>
                </td>
                <td class="px-4 py-3 text-gray-600">2 days ago</td>
            </tr>
            <tr>
                <td class="px-4 py-3">
                    <div class="font-medium text-gray-800">Test Task</div>
                    <div class="text-xs text-gray-500">Normal priority task</div>
                </td>
                <td class="px-4 py-3">
                    <span class="rounded-full bg-blue-50 px-2.5 py-1 text-xs font-medium text-blue-700">Normal</span>
                </td>
                <td class="px-4 py-3">
                    <div class="flex items-center gap-1">
                        <span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-purple-500 text-xs font-semibold text-white">B</span>
                        <span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-blue-500 text-xs font-semibold text-white">A</span>
                        <span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-amber-500 text-xs font-semibold text-white">D</span>
                    </div>
                </td>
                <td class="px-4 py-3 text-gray-600">5 days ago</td>
            </tr>
            <tr>
                <td class="px-4 py-3">
                    <div class="font-medium text-gray-800">Test Task</div>
                    <div class="text-xs text-gray-500">High priority task</div>
                </td>
                <td class="px-4 py-3">
                    <span class="rounded-full bg-red-50 px-2.5 py-1 text-xs font-medium text-red-700">High</span>
                </td>
                <td class="px-4 py-3">
                    <div class="flex items-center gap-1">
                        <span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-green-500 text-xs font-semibold text-white">C</span>
                        <span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-blue-500 text-xs font-semibold text-white">A</span>
                        <span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-purple-500 text-xs font-semibold text-white">B</span>
                    </div>
                </td>
                <td class="px-4 py-3 text-gray-600">1 week ago</td>
            </tr>
        </tbody>
    </table>
</div>
{% endblock table_tasks %}
